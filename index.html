<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinfast Test Drive Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --surface: rgba(15, 23, 42, 0.75);
            --surface-border: rgba(255,255,255,0.1);
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --card-bg: rgba(15, 23, 42, 0.6);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }

        /* ── Aurora Background ── */
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--text);
            background-color: #0d1117;
            position: relative;
            overflow-x: hidden;
        }

        .aurora {
            pointer-events: none;
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        .aurora::before {
            content: '';
            position: absolute;
            top: -40%;
            left: -20%;
            width: 80%;
            height: 80%;
            background: radial-gradient(ellipse at center, rgba(59,130,246,0.35) 0%, transparent 60%);
            animation: aurora-move-1 12s ease-in-out infinite alternate;
            border-radius: 50%;
            filter: blur(60px);
        }

        .aurora::after {
            content: '';
            position: absolute;
            bottom: -30%;
            right: -10%;
            width: 70%;
            height: 70%;
            background: radial-gradient(ellipse at center, rgba(99,102,241,0.3) 0%, transparent 60%);
            animation: aurora-move-2 15s ease-in-out infinite alternate;
            border-radius: 50%;
            filter: blur(80px);
        }

        .aurora-green {
            position: absolute;
            top: 30%;
            left: 40%;
            width: 60%;
            height: 60%;
            background: radial-gradient(ellipse at center, rgba(16,185,129,0.2) 0%, transparent 60%);
            animation: aurora-move-3 18s ease-in-out infinite alternate;
            border-radius: 50%;
            filter: blur(70px);
        }

        @keyframes aurora-move-1 {
            0%   { transform: translate(0, 0) scale(1); }
            50%  { transform: translate(8%, 12%) scale(1.1); }
            100% { transform: translate(-5%, 6%) scale(0.95); }
        }
        @keyframes aurora-move-2 {
            0%   { transform: translate(0, 0) scale(1); }
            50%  { transform: translate(-10%, -8%) scale(1.15); }
            100% { transform: translate(5%, -3%) scale(0.9); }
        }
        @keyframes aurora-move-3 {
            0%   { transform: translate(0, 0) scale(1); opacity: 0.6; }
            50%  { transform: translate(6%, -10%) scale(1.2); opacity: 1; }
            100% { transform: translate(-8%, 5%) scale(0.85); opacity: 0.4; }
        }

        /* ── Layout ── */
        header {
            position: sticky; top: 0; z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 40px;
            background: rgba(9, 14, 27, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--surface-border);
        }
        .logo-container h1 { font-size: 1.5rem; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
        .logo-container h1 span { color: var(--primary); }
        .header-badge {
            font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
            background: rgba(59,130,246,0.15); border: 1px solid rgba(59,130,246,0.3);
            color: var(--primary); padding: 3px 10px; border-radius: 20px;
        }

        main {
            position: relative; z-index: 1;
            display: grid; grid-template-columns: 320px 1fr; gap: 28px;
            padding: 32px 40px; flex: 1; max-width: 1600px; margin: 0 auto; width: 100%;
        }

        .glass {
            background: var(--card-bg);
            border: 1px solid var(--surface-border);
            border-radius: 16px;
            backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.05);
        }

        .sidebar-forms { display: flex; flex-direction: column; gap: 20px; }
        .form-card { padding: 24px; }
        .form-card h2 {
            font-size: 1.05rem; font-weight: 600; color: #fff;
            margin-bottom: 18px; padding-bottom: 12px;
            border-bottom: 1px solid var(--surface-border);
            display: flex; align-items: center; gap: 8px;
        }
        .form-card h2::before { content: ''; width: 4px; height: 16px; background: var(--primary); border-radius: 2px; display: inline-block; }

        .form-group { margin-bottom: 14px; display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 0.78rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; }

        input, select {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.12);
            color: var(--text);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.92rem;
            font-family: 'Outfit', sans-serif;
            outline: none;
            transition: all 0.2s;
            width: 100%;
        }
        input::placeholder { color: #475569; }
        input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        select option { background: #1e293b; color: var(--text); }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.7); cursor: pointer; }

        button {
            font-family: 'Outfit', sans-serif;
            cursor: pointer; font-weight: 500; font-size: 0.92rem;
            padding: 10px 18px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.05); color: var(--text);
            transition: all 0.2s;
        }
        button:hover { background: rgba(255,255,255,0.1); }
        button.primary {
            background: var(--primary); border-color: var(--primary); color: #fff;
            box-shadow: 0 0 20px rgba(59,130,246,0.3);
        }
        button.primary:hover { background: var(--primary-hover); box-shadow: 0 0 28px rgba(59,130,246,0.5); }
        button.danger { background: rgba(239,68,68,0.1); color: #fca5a5; border-color: rgba(239,68,68,0.3); }
        button.danger:hover { background: rgba(239,68,68,0.2); }

        .content-area { display: flex; flex-direction: column; gap: 20px; }
        .tabs { display: flex; gap: 6px; padding-bottom: 16px; border-bottom: 1px solid var(--surface-border); }
        .tab { padding: 8px 18px; border-radius: 8px; cursor: pointer; color: var(--text-muted); transition: all 0.2s; font-weight: 500; font-size: 0.9rem; }
        .tab:hover { color: var(--text); background: rgba(255,255,255,0.05); }
        .tab.active { color: #fff; background: var(--primary); box-shadow: 0 0 16px rgba(59,130,246,0.4); }

        .panel { display: none; animation: fadeIn 0.3s ease; }
        .panel.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .calendar-grid { display: grid; gap: 16px; }
        .day-card { padding: 20px; border-left: 3px solid var(--primary); }
        .day-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--surface-border); }
        .day-header h3 { font-size: 1rem; font-weight: 600; color: #fff; }

        .booking-list { display: flex; flex-direction: column; gap: 10px; }
        .booking-item {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.03); padding: 14px 16px;
            border-radius: 10px; border: 1px solid rgba(255,255,255,0.07);
            transition: background 0.2s;
        }
        .booking-item:hover { background: rgba(255,255,255,0.06); }
        .booking-item.completed { background: rgba(16,185,129,0.06); border-color: rgba(16,185,129,0.2); opacity: 0.7; }
        .booking-item.canceled { background: rgba(239,68,68,0.06); border-color: rgba(239,68,68,0.2); opacity: 0.7; }
        .booking-details { display: flex; flex-direction: column; gap: 5px; }
        .booking-title { font-weight: 600; color: #fff; font-size: 0.98rem; }
        .booking-meta { font-size: 0.85rem; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }
        .booking-actions { display: flex; gap: 8px; }

        .badge { padding: 3px 9px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .badge.booked { background: rgba(59,130,246,0.15); color: #93c5fd; border: 1px solid rgba(59,130,246,0.3); }
        .badge.completed { background: rgba(16,185,129,0.15); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.3); }
        .badge.canceled { background: rgba(239,68,68,0.15); color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); }

        .empty-state {
            text-align: center; padding: 60px 20px;
        }
        .empty-state h3 { color: var(--text-muted); font-size: 1.1rem; font-weight: 400; }
        .empty-state p { color: #334155; font-size: 0.9rem; margin-top: 6px; }

        /* Footer */
        footer {
            position: relative; z-index: 1;
            text-align: center; padding: 16px;
            color: #334155; font-size: 0.8rem;
            border-top: 1px solid var(--surface-border);
        }
    </style>
</head>
<body>
    <div class="aurora">
        <div class="aurora-green"></div>
    </div>

    <header>
        <div class="logo-container" style="display:flex; align-items:center; gap:12px;">
            <h1>VF <span>Demo</span> Tracker</h1>
            <span class="header-badge">Sales Portal</span>
        </div>
        <div style="display:flex; gap:12px; align-items:center;">
            <button onclick="exportToExcel()" class="primary">⬇ Export to Excel</button>
        </div>
    </header>

    <main>
        <div class="sidebar-forms">
            <div class="form-card glass">
                <h2>Book Test Drive</h2>
                <form id="bookingForm" onsubmit="handleBooking(event)">
                    <div class="form-group"><label>Vehicle</label><select id="b_vehicle" required></select></div>
                    <div class="form-group"><label>Date</label><input type="date" id="b_date" required></div>
                    <div class="form-group">
                        <label>Time Slot</label>
                        <select id="b_time" required>
                            <option value="09:00 AM">09:00 AM</option>
                            <option value="10:00 AM">10:00 AM</option>
                            <option value="11:00 AM">11:00 AM</option>
                            <option value="12:00 PM">12:00 PM</option>
                            <option value="01:00 PM">01:00 PM</option>
                            <option value="02:00 PM">02:00 PM</option>
                            <option value="03:00 PM">03:00 PM</option>
                            <option value="04:00 PM">04:00 PM</option>
                            <option value="05:00 PM">05:00 PM</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Customer Name</label><input type="text" id="b_customer" placeholder="John Doe" required></div>
                    <button type="submit" class="primary" style="width:100%; margin-top:6px;" id="bookBtn">Book Slot</button>
                </form>
            </div>
        </div>

        <div class="content-area">
            <div class="tabs">
                <div class="tab active">📅 Calendar View</div>
            </div>
            <div id="panel-calendar" class="panel active">
                <div class="calendar-grid" id="calendarContainer"></div>
            </div>
        </div>
    </main>

    <footer>VF Demo Tracker &mdash; Sales Portal &copy; 2025</footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getDatabase, ref, onValue, push, update, get } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAX9rEc7o621KAJQND8KVNRhg4DHrueGPI",
            authDomain: "vinfast-19159.firebaseapp.com",
            projectId: "vinfast-19159",
            storageBucket: "vinfast-19159.firebasestorage.app",
            messagingSenderId: "664066896957",
            appId: "1:664066896957:web:2c1c00a260a6cfd7de2654",
            measurementId: "G-TQH1LHYGRQ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let state = { role: 'Sales Exec', cars: [], bookings: [] };

        window.handleBooking = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('bookBtn');
            btn.disabled = true; btn.textContent = 'Checking...';
            const carId = document.getElementById('b_vehicle').value;
            const date  = document.getElementById('b_date').value;
            const time  = document.getElementById('b_time').value;
            const customer = document.getElementById('b_customer').value.trim();
            try {
                const snapshot = await get(ref(db, 'bookings'));
                let conflict = false;
                if (snapshot.exists()) snapshot.forEach(c => {
                    const b = c.val();
                    if (b.carId === carId && b.date === date && b.time === time && b.status === 'Booked') conflict = true;
                });
                if (conflict) { alert('⚠️ This vehicle is already booked for this time slot!'); return; }
                const car = state.cars.find(c => c.id === carId);
                await push(ref(db, 'bookings'), { carId, carModel: car.model, date, time, customer, status: 'Booked', bookedBy: 'Sales Exec' });
                document.getElementById('bookingForm').reset();
                alert('✅ Test drive booked successfully!');
            } catch(err) { alert('Error: ' + err.message); }
            finally { btn.disabled = false; btn.textContent = 'Book Slot'; }
        };

        window.updateBookingStatus = async (id, status) => {
            if (!confirm(`Mark as ${status}?`)) return;
            await update(ref(db, `bookings/${id}`), { status });
        };

        window.exportToExcel = () => {
            if (!state.bookings.length) return alert('No data to export!');
            let csv = "Date,Time,Vehicle Model,Customer,Status,Booked By\n";
            state.bookings.forEach(b => {
                csv += `${b.date||'N/A'},${b.time},"${(b.customer||'').replace(/"/g,'""')}",${b.carModel},${b.status},${b.bookedBy}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'Vinfast_TestDrives.csv';
            document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
        };

        function renderSelect() {
            const sel = document.getElementById('b_vehicle');
            sel.innerHTML = state.cars.length ? '' : '<option disabled>No vehicles available</option>';
            state.cars.forEach(c => { const o = document.createElement('option'); o.value = c.id; o.textContent = `${c.model} (${c.plate})`; sel.appendChild(o); });
        }

        function renderCalendar() {
            const el = document.getElementById('calendarContainer');
            if (!state.bookings.length) {
                el.innerHTML = '<div class="glass empty-state"><h3>No upcoming test drives</h3><p>Use the form to book your first slot.</p></div>'; return;
            }
            const grouped = {};
            [...state.bookings].sort((a,b) => a.date !== b.date ? a.date.localeCompare(b.date) : a.time.localeCompare(b.time))
                .forEach(b => { (grouped[b.date] = grouped[b.date]||[]).push(b); });
            el.innerHTML = Object.keys(grouped).sort().map(date => {
                const d = new Date(date).toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric',timeZone:'UTC'});
                return `<div class="glass day-card">
                    <div class="day-header"><h3>${d}</h3><span style="font-size:0.8rem;color:var(--text-muted)">${grouped[date].length} booking(s)</span></div>
                    <div class="booking-list">${grouped[date].map(b=>`
                        <div class="booking-item ${b.status.toLowerCase()}">
                            <div class="booking-details">
                                <div class="booking-title">${b.time} &mdash; ${b.carModel}</div>
                                <div class="booking-meta"><span class="badge ${b.status.toLowerCase()}">${b.status}</span> ${b.customer}</div>
                            </div>
                            <div class="booking-actions">
                                ${b.status==='Booked'?`<button class="primary" style="padding:5px 12px;font-size:0.78rem;" onclick="updateBookingStatus('${b.id}','Completed')">Complete</button>
                                <button class="danger" style="padding:5px 12px;font-size:0.78rem;" onclick="updateBookingStatus('${b.id}','Canceled')">Cancel</button>`:''}
                            </div>
                        </div>`).join('')}
                    </div>
                </div>`;
            }).join('');
        }

        document.getElementById('b_date').min = new Date().toISOString().split('T')[0];
        onValue(ref(db,'cars'), s => { state.cars=[]; s.forEach(c=>state.cars.push({id:c.key,...c.val()})); renderSelect(); });
        onValue(ref(db,'bookings'), s => { state.bookings=[]; s.forEach(c=>state.bookings.push({id:c.key,...c.val()})); renderCalendar(); });
    </script>
</body>
</html>
